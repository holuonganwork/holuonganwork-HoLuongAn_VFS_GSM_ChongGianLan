name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraud_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: fraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud_test -d fraud_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fraud_test:local-test-only@localhost:5432/fraud_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend scripts
      - run: python -m ruff format --check backend scripts
      - run: python -m pytest -q
